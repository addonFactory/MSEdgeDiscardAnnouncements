name: Release

on:
  push:
    branches: [ main, master ]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    - name: Lint
      run: uv run ruff check addon

    - name: Validate addon.toml
      run: uv run nvaddon check

    - name: Build add-on
      run: |
        uv run nvaddon build
        uv run nvaddon pot

    - name: Read add-on metadata
      run: |
        uv run python - <<'PY' >> "$GITHUB_ENV"
        import tomllib
        config = tomllib.load(open("addon.toml", "rb"))
        addon = config["addon"]
        release = config.get("release", {})
        print(f"ADDON_NAME={addon['name']}")
        print(f"ADDON_VERSION={addon['version']}")
        print(f"ADDON_CHANNEL={addon.get('updateChannel') or 'stable'}")
        print(f"ADDON_AUTO_SUBMIT={str(release.get('autoSubmit', True)).lower()}")
        PY

    - name: Upload add-on artifact
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v7
      with:
        name: packaged_addon
        path: ./*.nvda-addon
        archive: false

    - name: Upload translation template artifact
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v7
      with:
        name: translation_template
        path: ./*.pot
        archive: false

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        prerelease=""
        case "${{ github.ref_name }}" in
          *-stable) ;;
          *) prerelease="--prerelease" ;;
        esac

        gh release create "${{ github.ref_name }}" \
          ./*.nvda-addon ./*.pot \
          --title "${{ github.ref_name }}" \
          --generate-notes \
          $prerelease

    - name: Submit to the NVDA add-on store
      if: ${{ startsWith(github.ref, 'refs/tags/') && env.ADDON_AUTO_SUBMIT == 'true' }}
      uses: beqabeqa473/submitNVDAAddon@v1
      with:
        addon_name: ${{ env.ADDON_NAME }}
        addon_version: ${{ env.ADDON_VERSION }}
        channel: ${{ env.ADDON_CHANNEL }}
        download_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.ADDON_NAME }}-${{ env.ADDON_VERSION }}.nvda-addon
        source_url: ${{ github.server_url }}/${{ github.repository }}
        token: ${{ secrets.USER_TOKEN }}
